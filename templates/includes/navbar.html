<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'movie-list' %}">
            🎬 Cinema
        </a>

        <button

            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <div class="navbar-nav me-auto">

                <a
                    class="nav-link"
                    href="{% url 'movie-list' %}"
                >
                    Filmy

                <a

                    href="{% url 'screening-list' %}"
                >
                    Repertuar
                </a>

            </div>

            <div class="navbar-nav align-items-center">

                {% if user.is_authenticated %}

                    <a

                        href="{% url 'user-reservations' %}"
                    >
                        Moje rezerwacje
                    </a>

                    <span class="navbar-text me-3">
                        Witaj {{ user.username }}
                    </span>

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-outline-light btn-sm"
                        >
                            Wyloguj
                        </button>
                    </form>

                {% else %}

                    <a
                        class="nav-link"

                    </a>

                    <a
