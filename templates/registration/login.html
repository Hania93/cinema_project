{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">

        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="h3 mb-4 text-center">
                    Logowanie
                </h1>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn cinema-btn w-100"
                    >
                        Zaloguj
                    </button>
                </form>

                <p class="mt-3 text-center">
                    Nie masz konta?
                    <a href="{% url 'register' %}">
                        Zarejestruj się
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
